name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version declared by UI and tokens (glass, Docs and tooling use their manifest versions)
        required: true
        default: "0.11.5"
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  LENSO_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Validate version, live refs and exact-main verification before approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-packages.ts --check

  release:
    needs: preflight
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Revalidate version, live refs and exact-main verification after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-packages.ts --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@12.0.1 --ignore-scripts
      - run: bun install --frozen-lockfile
      - run: bun test tests/publish-packages.test.ts
      - name: Publish public packages with npm OIDC provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/publish-packages.ts
