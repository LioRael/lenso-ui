name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: release-fixed-group
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: pending
        run: |
          version="$(node -p "require('./packages/ui/package.json').version")"
          pending=false
          for name in tokens primitives ui; do
            tag="@lenso/$name@$version"
            if ! npm view "$tag" version --json >/dev/null 2>&1 ||
              ! gh release view "$tag" --json tagName >/dev/null 2>&1; then
              pending=true
            fi
          done
          echo "value=$pending" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish validated fixed-group packages
        run: node tooling/publish-fixed-group.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LENSO_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
