name: Performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
      - run: bun install --frozen-lockfile
      - working-directory: apps/docs
        run: bunx --no-install playwright install --with-deps chromium
      - run: bunx turbo run build --filter=@lenso/ui-docs
        env:
          LENSO_DOCS_SITE: https://ui.lenso.dev
      # No build or parallel browser workload runs during measurements.
      - name: Measure production loading and enforce geometry-read budget
        run: node apps/docs/test/browser-gate.mjs performance
        env:
          BROWSER_ARTIFACTS: ${{ runner.temp }}/performance-evidence
      - name: Preserve samples and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-evidence
          retention-days: 14
