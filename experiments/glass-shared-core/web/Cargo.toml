[package]
name = "lenso-glass-core-web"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT AND LGPL-2.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lenso-glass-core-prototype = { path = "../core" }
lenso-glass-renderer = { path = "../../glass-driver-comparison/renderer" }
wasm-bindgen = "=0.2.127"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement"] }
