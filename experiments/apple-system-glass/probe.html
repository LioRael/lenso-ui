<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apple system glass probe</title>
  <style>
    :root {
      font: 16px system-ui;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 32px;
    }
    .scene {
      padding: 36px;
      border-radius: 24px;
      background: repeating-linear-gradient(
        110deg,
        #d84848 0 18px,
        #2a74c8 18px 36px,
        #62ab68 36px 54px
      );
    }
    .panel {
      margin: 20px 0;
      padding: 28px;
      border-radius: 24px;
      color: white;
      font-weight: 600;
    }
    .fallback {
      background: rgb(100 100 100 / 25%);
      backdrop-filter: blur(12px);
    }
    .system {
      -apple-visual-effect: -apple-system-glass-material;
    }
    @supports (-apple-visual-effect: -apple-system-glass-material) {
      .enhanced {
        background: transparent;
        backdrop-filter: none;
        -apple-visual-effect: -apple-system-glass-material;
      }
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <h1>Apple system glass</h1>
  <div class="scene">
    <div class="panel fallback">CSS backdrop blur baseline</div>
    <div class="panel system">System material only</div>
    <div class="panel fallback enhanced">Feature-detected enhancement</div>
  </div>
  <pre id="result"></pre>
  <script>
    window.probe = () => ({
      userAgent: navigator.userAgent,
      glass: CSS.supports("-apple-visual-effect", "-apple-system-glass-material"),
      systemBlur: CSS.supports("-apple-visual-effect", "-apple-system-blur-material"),
      panels: [...document.querySelectorAll(".panel")].map((element) => {
        const style = getComputedStyle(element);
        return {
          name: element.textContent,
          effect: style.getPropertyValue("-apple-visual-effect"),
          backdrop: style.backdropFilter,
          background: style.backgroundColor,
        };
      }),
    });
    document.querySelector("#result").textContent = JSON.stringify(window.probe(), null, 2);
  </script>
</html>
