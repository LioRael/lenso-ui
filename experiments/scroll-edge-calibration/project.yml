name: ScrollEdgeProbe
options:
  deploymentTarget:
    iOS: "27.0"
targets:
  ScrollEdgeProbe:
    type: application
    platform: iOS
    sources: [Probe.swift, pattern.png, photo.png, web.html]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.lenso.ScrollEdgeProbe
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
