<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glass driver comparison</title>
  <body>
    <main>
      <h1>Glass driver comparison</h1>
      <p>
        Identical iOS/iPadOS shaders, texture dimensions and render passes. TypeScript versus
        Rust/Wasm.
      </p>
      <button id="run">Compare drivers</button><output id="status">Ready</output>
      <section>
        <h2>TypeScript</h2>
        <canvas id="ts" width="1200" height="800" style="width: 600px; max-width: 100%"></canvas>
      </section>
      <section>
        <h2>Wasm</h2>
        <canvas id="wasm" width="1200" height="800" style="width: 600px; max-width: 100%"></canvas>
      </section>
      <pre id="results"></pre>
    </main>
    <script type="module" src="/lab.js"></script>
  </body>
</html>
