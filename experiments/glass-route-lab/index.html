<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liquid Glass · 渲染路线实验</title>
  <link rel="stylesheet" href="/lab.css" />
  <main>
    <p class="eyebrow">LENSO / RENDERING LAB</p>
    <h1>同一块玻璃，不同渲染路线。</h1>
    <p class="intro">
      比较受控背景下的材质、交互与帧耗时。实验光学模型，不代表已复现 Figma 的私有渲染器。
    </p>
    <form id="options">
      <label
        >路线<select name="route">
          <option value="shader">JS + WebGL2 shader</option>
          <option value="rust">Rust / Wasm + WebGL2</option>
          <option value="aave">Aave 思路 · SVG 内容滤镜</option>
          <option value="html">HTML-in-Canvas + shader</option>
        </select></label
      >
      <label
        >外观<select name="theme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
        </select></label
      >
      <label
        >材质<select name="version">
          <option value="27">iOS 27</option>
          <option value="26">iOS 26</option>
        </select></label
      >
      <label
        >尺寸<select name="profile">
          <option value="medium">Medium</option>
          <option value="small">Small</option>
        </select></label
      >
      <label
        >数量<select name="count">
          <option>1</option>
          <option>16</option>
          <option>100</option>
        </select></label
      >
      <label
        >背景<select name="source">
          <option value="canvas">受控画布</option>
          <option value="dom">可编辑 DOM</option>
          <option value="video">实时视频</option>
        </select></label
      >
      <button type="submit">切换场景</button>
    </form>
    <div class="toolbar">
      <button id="motion">播放背景</button><button id="measure">测量 3 秒</button
      ><span id="status" role="status">正在准备…</span>
    </div>
    <div id="viewport">
      <div id="scene">
        <canvas id="background"></canvas>
        <div id="dom-source"></div>
        <canvas id="glass"></canvas>
        <div id="controls"></div>
      </div>
    </div>
    <p id="capability"></p>
    <p class="note">
      可点击或用 Tab / Space 操作玻璃上的按钮。DOM
      与视频背景单独测试；不支持的能力会明确显示，不会悄悄换成静态图片。
    </p>
    <pre id="metrics" aria-live="polite"></pre>
  </main>
  <script type="module" src="/lab.js"></script>
</html>
